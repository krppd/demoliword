[package]
name = "demoliword"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Puzzle diario de demolicion: colapsa la estructura con 5 cargas en el orden correcto (Wordle fisico)."
repository = "https://github.com/USER/demoliword"

[dependencies]
macroquad = { version = "0.4", features = [] }
rapier2d = "0.36"
phf = { version = "0.11", features = ["macros"] }

[profile.release]
lto = true
