[package]
name = "demoliword"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Daily demolition puzzle: collapse the structure with 5 charges in the right order (physical Wordle)."
repository = "https://github.com/krppd/demoliword"

[dependencies]
macroquad = { version = "0.4", features = [] }
rapier2d = "0.36"
phf = { version = "0.11", features = ["macros"] }

[profile.release]
lto = true
